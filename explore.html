<!DOCTYPE html>
<!--
  BiteBuddy — Explore map 🗺️
  A real map with PINS for nearby restaurants. Click a pin → see the name + a button to
  open Forky's review for that place. Uses Leaflet (free, open-source) with OpenStreetMap
  tiles — no API key, no cost. Places come from the same engine.js (Overpass) the
  "Recommend me" button uses.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteBuddy — Explore the map</title>
  <meta name="description" content="Explore nearby restaurants on a map — tap a pin for Forky's review. 🗺️">
  <meta name="theme-color" content="#2F80ED">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js"></script>
  <!-- Leaflet: the free map library (CSS + JS from its official CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- BiteBuddy's brain (gives us nearby places with coordinates) -->
  <script src="config.production.js"></script>
  <script src="config.js"></script>
  <script src="engine.js"></script>
</head>

<body>

  <!-- ===== TOP BAR ===== -->
  <header class="topbar">
    <a href="index.html" class="brand" style="text-decoration:none;color:inherit;">
      <img src="logo.svg" alt="Forky the BiteBuddy mascot" class="brand-logo">
      <span class="brand-name"><span class="blue">Bite</span><span class="green">Buddy</span></span>
    </a>
    <nav class="nav">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="profile.html" data-auth="in" class="nav-profile-link"><span class="nav-avatar" data-nav-avatar></span><span data-i18n="nav.profile">Profile</span></a>
      <a href="signup.html" class="btn-ghost" data-auth="out" data-i18n="nav.login">Log in</a>
      <a href="#" class="btn-ghost" data-auth="in" data-action="logout" data-i18n="nav.logout">Log out</a>
      <select id="lang-select" class="lang-select" aria-label="Language">
        <option value="en">🇬🇧 English</option>
        <option value="sv">🇸🇪 Svenska</option>
      </select>
    </nav>
  </header>

  <main class="explore deco-host">
    <div class="page-deco" aria-hidden="true"><span>📍</span><span>🗺️</span><span>🍴</span><span>🍽️</span><span>📌</span><span>🧭</span></div>
    <h1 class="explore-title" data-i18n="explore.title">🗺️ Explore nearby</h1>
    <p class="explore-sub" data-i18n="explore.sub">Tap a pin to see the place — then open Forky's review.</p>

    <!-- type a city / use 📍, then show pins -->
    <div class="location-bar">
      <!-- the box + a little ✕ that clears it so you can type a city directly -->
      <span class="loc-input-wrap">
        <input type="text" id="explore-loc" class="location-select" list="city-list"
               data-i18n-placeholder="loc.placeholder" placeholder="Type a city, or tap 📍">
        <button id="explore-clear" class="loc-clear" type="button" title="Clear" aria-label="Clear">✕</button>
      </span>
      <datalist id="city-list">
        <option value="Landskrona"></option>
        <option value="Helsingborg"></option>
        <option value="Malmö"></option>
        <option value="Lund"></option>
      </datalist>
      <button id="explore-near" class="near-me-btn" type="button" title="Use my location" aria-label="Use my location">📍</button>
      <button id="explore-go" class="btn-primary" data-i18n="explore.showbtn">Show places 🍴</button>
    </div>

    <p id="explore-status" class="explore-status"></p>
    <div id="map" class="explore-map"></div>
  </main>

  <footer class="footer">
    <p data-i18n="footer">🐾 BiteBuddy — made with curiosity by Magic.</p>
    <p class="footer-links"><a href="about.html" data-i18n="nav.about">About</a></p>
  </footer>

  <script src="lang.js"></script>

  <script>
    // open a place's review page (called from a map pin's popup button)
    function goPlace(encoded) {
      localStorage.setItem("bitebuddy-search", decodeURIComponent(encoded));
      window.location.href = "results.html";
    }

    (function () {
      const sv = (localStorage.getItem("bitebuddy-lang") || "en") === "sv";
      const statusEl = document.getElementById("explore-status");
      const input = document.getElementById("explore-loc");

      const clearBtn = document.getElementById("explore-clear");
      const NEAR_LABEL = sv ? "📍 Nära mig" : "📍 Near me";

      // are we showing "near me" right now? A real flag — don't guess from the text.
      let nearMode = false;
      // show the ✕ only when there's something to clear
      function showClear() { clearBtn.style.display = input.value.trim() ? "block" : "none"; }

      // start the box from the saved location
      const saved = localStorage.getItem("bitebuddy-location");
      if (saved === "near" && localStorage.getItem("bitebuddy-geo")) { input.value = NEAR_LABEL; nearMode = true; }
      else if (saved && saved !== "near") input.value = saved;
      showClear();

      // if the map library didn't load (offline / CDN blocked), fail gracefully
      if (!window.L) {
        if (statusEl) statusEl.textContent = sv
          ? "😅 Kunde inte ladda kartan — kolla din internetanslutning och ladda om."
          : "😅 Couldn't load the map — check your internet and reload.";
        return;
      }

      // set up the map (centred on Landskrona to start)
      const map = L.map("map").setView([55.8703, 12.8300], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap", maxZoom: 19,
      }).addTo(map);
      let pinLayer = null;

      async function showPlaces(loc) {
        statusEl.textContent = sv ? "🔎 Letar upp ställen…" : "🔎 Finding places…";
        let places = [];
        try { places = await nearbyFoodPlaces(loc); } catch (e) { places = []; }

        if (pinLayer) { map.removeLayer(pinLayer); pinLayer = null; }
        const withCoords = (places || []).filter(function (p) { return p.lat && p.lon; });

        if (!withCoords.length) {
          // a kinder, more useful message when "near me" finds nothing
          statusEl.textContent = nearMode
            ? (sv ? "😅 Hittade inga matställen nära dig — prova att skriva en stad istället."
                  : "😅 No food places found near you — try typing a city instead.")
            : (sv ? "😅 Hittade inga ställen där just nu — prova en annan stad."
                  : "😅 Couldn't find places there right now — try another city.");
          return;
        }

        const markers = withCoords.map(function (p) {
          // build the popup as a real element (safe from HTML injection AND from names
          // with apostrophes like "McDonald's", which used to break an inline onclick)
          const div = document.createElement("div");
          div.innerHTML = "<strong>🍴 " + escapeHtml(p.name) + "</strong>" +
            (p.food ? "<br>" + escapeHtml(p.food) : "") +
            '<br><a href="#" class="map-link">' + (sv ? "Se Forkys recension →" : "See Forky's review →") + "</a>";
          div.querySelector("a").addEventListener("click", function (e) { e.preventDefault(); goPlace(p.name); });
          return L.marker([p.lat, p.lon]).bindPopup(div);
        });
        pinLayer = L.featureGroup(markers).addTo(map);
        map.fitBounds(pinLayer.getBounds().pad(0.2));   // zoom to fit all pins

        statusEl.textContent = (sv ? "📍 Visar " : "📍 Showing ") + withCoords.length + (sv ? " ställen" : " places");
      }

      // 📍 Find which CITY you're in, then search that whole city. Town centers always
      // have restaurants, so this is far more reliable than a tiny circle around your
      // exact spot (which is empty if you're at home / in a quiet area).
      function goNearMe() {
        if (!navigator.geolocation) { alert(sv ? "Kan inte dela plats — skriv en stad." : "Can't share location — type a city."); return; }
        statusEl.textContent = sv ? "📍 Hämtar din plats…" : "📍 Getting your location…";
        navigator.geolocation.getCurrentPosition(async function (pos) {
          const lat = pos.coords.latitude, lon = pos.coords.longitude;
          localStorage.setItem("bitebuddy-geo", JSON.stringify({ lat: lat, lon: lon }));
          statusEl.textContent = sv ? "🏙️ Hittar din stad…" : "🏙️ Finding your city…";

          // ask the server which city these coords are in
          let city = null;
          const proxyUrl = window.BITEBUDDY_CONFIG && window.BITEBUDDY_CONFIG.proxyUrl;
          if (proxyUrl) {
            try {
              const ctrl = new AbortController();
              const t = setTimeout(function () { ctrl.abort(); }, 9000);
              const res = await fetch(proxyUrl + "/reverse", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ lat: lat, lon: lon }), signal: ctrl.signal,
              });
              clearTimeout(t);
              if (res.ok) city = (await res.json()).city || null;
            } catch (e) { /* fall through to coords */ }
          }

          if (city) {
            // found your city → put it in the box and search it
            nearMode = false;
            input.value = city;
            localStorage.setItem("bitebuddy-location", city);
            showClear();
            showPlaces(city);
          } else {
            // couldn't name your city → fall back to searching around your coords
            nearMode = true;
            input.value = NEAR_LABEL;
            localStorage.setItem("bitebuddy-location", "near");
            showClear();
            showPlaces("near");
          }
        }, function () {
          statusEl.textContent = sv ? "😅 Kunde inte hämta din plats — skriv en stad." : "😅 Couldn't get your location — type a city.";
        }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
      }

      // "Show places" — figure out if it's near-me or a typed city
      function go() {
        const typed = input.value.trim();
        if (nearMode || typed === NEAR_LABEL) { goNearMe(); return; }   // re-fetch fresh coords
        if (!typed) {
          if (localStorage.getItem("bitebuddy-geo")) { goNearMe(); return; }
          showPlaces("Landskrona"); return;
        }
        nearMode = false;
        localStorage.setItem("bitebuddy-location", typed);
        showPlaces(typed);
      }

      // typing means you've left "near me" mode
      input.addEventListener("input", function () {
        if (input.value.trim() !== NEAR_LABEL) nearMode = false;
        showClear();
      });
      // the ✕ wipes the box so you can type a city directly
      clearBtn.addEventListener("click", function () {
        input.value = "";
        nearMode = false;
        localStorage.removeItem("bitebuddy-location");
        showClear();
        input.focus();
      });

      document.getElementById("explore-go").addEventListener("click", go);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
      document.getElementById("explore-near").addEventListener("click", goNearMe);

      // show something on first load
      if (nearMode) showPlaces("near");
      else showPlaces(input.value.trim() || "Landskrona");
    })();
  </script>
</body>
</html>
