name = "bitebuddy-proxy"
main = "proxy.js"
compatibility_date = "2024-09-23"

# KV namespace for rate limiting (stores "how many searches today per IP")
# After running: wrangler kv:namespace create BB_KV
# paste the returned id below
[[kv_namespaces]]
binding = "BB_KV"
id = "PASTE_YOUR_KV_ID_HERE"
