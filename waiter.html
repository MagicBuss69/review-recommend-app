<!DOCTYPE html>
<!--
  BiteBuddy — AI Waiter
  Magic's idea: chat with an AI "waiter" who knows the restaurant, BEFORE you go.
  For now the waiter gives clever pre-written answers (a demo brain).
  Later we connect a real AI (like Gemini) so he can answer anything.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteBuddy — Your AI Waiter</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- ===== TOP BAR ===== -->
  <header class="topbar">
    <a href="index.html" class="brand" style="text-decoration:none;">
      <img src="logo.svg" alt="Forky the BiteBuddy mascot" class="brand-logo">
      <span class="brand-name"><span class="blue">Bite</span><span class="green">Buddy</span></span>
    </a>
    <nav class="nav">
      <a href="profile.html" data-i18n="nav.profile">🐾 Profile</a>
      <a href="results.html" class="btn-ghost" data-i18n="nav.backresult">Back to result</a>
      <select id="lang-select" class="lang-select" aria-label="Language">
        <option value="en">🇬🇧 English</option>
        <option value="sv">🇸🇪 Svenska</option>
      </select>
    </nav>
  </header>

  <div class="demo-banner" data-i18n="waiter.banner">✨ Demo waiter — gives sample answers for now. Real AI coming soon!</div>

  <!-- ===== THE CHAT ===== -->
  <main class="waiter">
    <div class="waiter-head">
      <h1 data-i18n="waiter.title">👨‍🍳 Tony, your AI waiter</h1>
      <p class="muted-text" data-i18n="waiter.subtitle">at Mister York, Landskrona · ask me anything before you visit!</p>
    </div>

    <!-- Messages show up here -->
    <div id="chat" class="chat"></div>

    <!-- Type-a-question row -->
    <div class="chat-box">
      <input
        type="text"
        id="chat-input"
        class="link-input"
        data-i18n-placeholder="waiter.placeholder"
        placeholder="Ask Tony... (e.g. 'what's good here?')">
      <button id="chat-btn" class="btn-primary" data-i18n="waiter.askbtn">Ask 🍽️</button>
    </div>

    <!-- Quick question buttons so it's easy to start.
         (data-q stays English so the demo brain still understands the click.) -->
    <div class="quick-qs">
      <button class="chip" data-q="What's the best burger here?" data-i18n="waiter.chip1">Best burger?</button>
      <button class="chip" data-q="Do you have vegetarian options?" data-i18n="waiter.chip2">Vegetarian?</button>
      <button class="chip" data-q="Tell me about the milkshakes" data-i18n="waiter.chip3">Milkshakes?</button>
      <button class="chip" data-q="Is it busy at lunch?" data-i18n="waiter.chip4">Busy times?</button>
    </div>
  </main>

  <footer class="footer">
    <p data-i18n="footer">🐾 BiteBuddy — made with curiosity by Magic.</p>
  </footer>

  <!-- the language system (English + Svenska) -->
  <script src="lang.js"></script>

  <script>
    // ===== The waiter's "demo brain" =====
    // It reads your question, looks for keywords, and gives a fitting answer.
    // (All based on Mister York's menu. Later, a real AI replaces this.)
    function waiterReply(question) {
      const q = question.toLowerCase();

      if (q.includes("hi") || q.includes("hello") || q.includes("hey")) {
        return "Hey there! 👋 Welcome to Mister York. Ask me about our burgers, fries, milkshakes, prices, or busy times!";
      }
      if (q.includes("best") || q.includes("good") || q.includes("recommend") || q.includes("popular")) {
        return "Our smash burgers are the talk of the town! 🍔 Pair one with loaded fries and you can't go wrong.";
      }
      if (q.includes("burger") || q.includes("smash")) {
        return "Great choice! Our American-style smash burgers are crispy-edged and super juicy — the #1 thing people come back for. 🍔";
      }
      if (q.includes("chicken")) {
        return "Our crispy chicken burger is a favorite — crunchy outside, tender inside. 🍗";
      }
      if (q.includes("fries") || q.includes("loaded")) {
        return "You HAVE to try the loaded fries 🍟 — topped and loaded, perfect for sharing (or not 😄).";
      }
      if (q.includes("shake") || q.includes("milkshake") || q.includes("drink") || q.includes("dessert")) {
        return "Our thick milkshakes are the perfect finish 🥤 — a classic with smash burgers!";
      }
      if (q.includes("vegetarian") || q.includes("veggie") || q.includes("vegan")) {
        return "Yes! We have vegetarian alternatives so plant-based friends are covered too. 🥦";
      }
      if (q.includes("price") || q.includes("cost") || q.includes("expensive") || q.includes("cheap")) {
        return "We're fair-priced for the portions — good value, especially a burger-and-fries combo. 💰";
      }
      if (q.includes("busy") || q.includes("weekend") || q.includes("wait") || q.includes("lunch")) {
        return "Lunchtime can get busy since we're the new spot in town 🚀 — pop in a bit earlier or later for a shorter wait. 📅";
      }
      if (q.includes("kid") || q.includes("family") || q.includes("child")) {
        return "Families are very welcome — burgers, fries and shakes are a hit with kids! 👨‍👩‍👧";
      }
      if (q.includes("thank")) {
        return "My pleasure! Hope to see you soon at Mister York. 🍔";
      }
      // If nothing matches:
      return "Good question! 🤔 In the full version I'll know every detail. For now, try asking about our burgers, chicken, loaded fries, milkshakes, or veggie options!";
    }

    // ===== Make the chat work on screen =====
    const chat = document.getElementById("chat");
    const chatInput = document.getElementById("chat-input");
    const chatBtn = document.getElementById("chat-btn");

    // Add one message bubble to the chat (who = "waiter" or "you")
    function addMessage(who, text) {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + who;
      bubble.textContent = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight; // keep newest message in view
    }

    // Send whatever is typed
    function send() {
      const text = chatInput.value.trim();
      if (text === "") return;
      addMessage("you", text);
      chatInput.value = "";
      // Tony "thinks" for a moment, then replies
      setTimeout(function () {
        addMessage("waiter", waiterReply(text));
      }, 500);
    }

    chatBtn.addEventListener("click", send);
    chatInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") send();
    });

    // The quick-question chips
    document.querySelectorAll(".chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        chatInput.value = chip.getAttribute("data-q");
        send();
      });
    });

    // Tony greets you first
    const waiterLang = localStorage.getItem("bitebuddy-lang") || "en";
    addMessage("waiter", waiterLang === "sv"
      ? "Hej! 👋 Jag är Tony, din kypare på Mister York. Fråga mig vad som helst innan du besöker!"
      : "Hey! 👋 I'm Tony, your waiter at Mister York. Ask me anything before you visit!");
  </script>

</body>
</html>
