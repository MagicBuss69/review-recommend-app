<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="BiteBuddy logo - Forky the fork critter">
  <!-- BiteBuddy mascot: "Forky" the fork critter. Blue body (trust) + green accent (fresh). -->

  <!-- Green leaf sprout growing between the fork prongs -->
  <path d="M100 4 C90 16, 90 32, 100 42 C110 32, 110 16, 100 4 Z" fill="#27AE60"/>
  <line x1="100" y1="12" x2="100" y2="38" stroke="#1E8E4E" stroke-width="2" stroke-linecap="round"/>

  <!-- Fork prongs (act like spiky hair) -->
  <rect x="58"  y="20" width="13" height="60" rx="6" fill="#2F80ED"/>
  <rect x="80"  y="20" width="13" height="60" rx="6" fill="#2F80ED"/>
  <rect x="107" y="20" width="13" height="60" rx="6" fill="#2F80ED"/>
  <rect x="129" y="20" width="13" height="60" rx="6" fill="#2F80ED"/>

  <!-- Head (the flat part of the fork) -->
  <rect x="50" y="62" width="100" height="80" rx="32" fill="#2F80ED"/>

  <!-- Green cheeks -->
  <circle cx="64"  cy="112" r="8" fill="#27AE60"/>
  <circle cx="136" cy="112" r="8" fill="#27AE60"/>

  <!-- Eyes -->
  <ellipse cx="82"  cy="95" rx="13" ry="15" fill="#FFFFFF"/>
  <ellipse cx="118" cy="95" rx="13" ry="15" fill="#FFFFFF"/>
  <circle cx="83"  cy="99" r="6" fill="#22304A"/>
  <circle cx="119" cy="99" r="6" fill="#22304A"/>
  <!-- tiny sparkle in eyes -->
  <circle cx="80"  cy="95" r="2" fill="#FFFFFF"/>
  <circle cx="116" cy="95" r="2" fill="#FFFFFF"/>

  <!-- Smile -->
  <path d="M76 120 Q100 136 124 120" fill="none" stroke="#22304A" stroke-width="5" stroke-linecap="round"/>

  <!-- Handle (the body) -->
  <rect x="88" y="138" width="24" height="80" rx="12" fill="#2F80ED"/>
</svg>
