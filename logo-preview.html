<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BiteBuddy — Logo Preview</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      background: #F4F8FF;          /* very light blue background */
      color: #22304A;              /* soft dark text */
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .logo-lockup { display: flex; align-items: center; gap: 16px; }
    .wordmark { font-size: 56px; font-weight: 800; }
    .bite  { color: #2F80ED; }     /* blue */
    .buddy { color: #27AE60; }     /* green */
    .tagline { margin-top: 8px; font-size: 20px; color: #6B7A90; }
    .sizes { margin-top: 48px; display: flex; align-items: flex-end; gap: 28px; }
    .sizes div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #6B7A90; }
    .card { margin-top: 40px; background: #fff; border-radius: 16px; padding: 24px 32px; box-shadow: 0 6px 24px rgba(47,128,237,.12); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-lockup">
      <img src="logo.svg" alt="Forky the BiteBuddy mascot" width="120" height="144">
      <div>
        <div class="wordmark"><span class="bite">Bite</span><span class="buddy">Buddy</span></div>
      </div>
    </div>
    <div class="tagline">Your buddy who knows where to eat. 🐾</div>
  </div>

  <!-- Shows the logo stays sharp at every size, even tiny like a browser-tab icon -->
  <div class="sizes">
    <div><img src="logo.svg" width="100" height="120"><span>big</span></div>
    <div><img src="logo.svg" width="56"  height="67"><span>medium</span></div>
    <div><img src="logo.svg" width="32"  height="38"><span>tab icon</span></div>
    <div><img src="logo.svg" width="16"  height="19"><span>tiny</span></div>
  </div>
</body>
</html>
