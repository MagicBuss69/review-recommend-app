<!DOCTYPE html>
<!--
  BiteBuddy — Admin Panel 🛠️
  A private page for YOU (Magic) to read the feedback people sent through the box on the
  homepage. Honest note: with no server yet, this shows feedback saved on THIS device.
  Once there's a server, it'll show everyone's feedback from anywhere.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteBuddy — Admin Panel</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>

<body>

  <header class="topbar">
    <a href="index.html" class="brand" style="text-decoration:none;color:inherit;">
      <img src="logo.svg" alt="Forky the BiteBuddy mascot" class="brand-logo">
      <span class="brand-name"><span class="blue">Bite</span><span class="green">Buddy</span></span>
    </a>
    <nav class="nav">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="profile.html" data-auth="in" class="nav-profile-link"><span class="nav-avatar" data-nav-avatar></span><span data-i18n="nav.profile">Profile</span></a>
      <select id="lang-select" class="lang-select" aria-label="Language">
        <option value="en">🇬🇧 English</option>
        <option value="sv">🇸🇪 Svenska</option>
      </select>
    </nav>
  </header>

  <main class="about deco-host">
    <div class="page-deco" aria-hidden="true"><span>💬</span><span>📨</span><span>📝</span><span>🗒️</span><span>🛠️</span><span>🐾</span></div>
    <div class="about-head">
      <h1 class="about-title" data-i18n="admin.title">🛠️ Admin Panel</h1>
      <p class="about-sub" data-i18n="admin.sub">Feedback people have sent to Forky.</p>
    </div>

    <p class="admin-note hint" data-i18n="admin.note">ℹ️ For now this shows feedback saved on THIS device. With a server later, it'll gather everyone's.</p>

    <div id="feedback-list"></div>

    <button id="clear-feedback" class="btn-ghost" style="margin-top:18px;" data-i18n="admin.clear">🗑️ Clear all feedback</button>
  </main>

  <footer class="footer">
    <p data-i18n="footer">🐾 BiteBuddy — made with curiosity by Magic.</p>
    <p class="footer-links">
      <a href="about.html" data-i18n="nav.about">About</a> ·
      <a href="guide.html" data-i18n="nav.guide">Guide</a>
    </p>
  </footer>

  <script src="lang.js"></script>
  <script>
    (function () {
      const sv = (localStorage.getItem("bitebuddy-lang") || "en") === "sv";

      // 🔒 owner-only: anyone who isn't the admin account gets a polite locked screen
      const cfg = window.BITEBUDDY_CONFIG || {};
      const adminEmail = (cfg.adminEmail || "").toLowerCase();
      let acc = null; try { acc = JSON.parse(localStorage.getItem("bitebuddy-account") || "null"); } catch (e) {}
      const isAdmin = adminEmail && acc && acc.email && acc.email.toLowerCase() === adminEmail;
      if (!isAdmin) {
        const main = document.querySelector(".about");
        if (main) main.innerHTML =
          '<div class="about-head"><h1 class="about-title">🔒 ' + (sv ? "Endast för ägaren" : "Owner only") + "</h1>" +
          '<p class="about-sub">' + (sv ? "Den här panelen är bara för BiteBuddys ägare." : "This panel is just for BiteBuddy's owner.") + "</p></div>" +
          '<a href="index.html" class="btn-primary big-btn">🏠 ' + (sv ? "Till start" : "Home") + "</a>";
        return;
      }

      const listEl = document.getElementById("feedback-list");

      // "2h ago" style time (handles missing times gracefully)
      function timeAgo(ms) {
        if (!ms) return "";
        const secs = Math.floor((Date.now() - ms) / 1000);
        if (secs < 60) return sv ? "nyss" : "just now";
        const m = Math.floor(secs / 60); if (m < 60) return m + (sv ? " min sedan" : "m ago");
        const h = Math.floor(m / 60); if (h < 24) return h + (sv ? " tim sedan" : "h ago");
        return Math.floor(h / 24) + (sv ? " dgr sedan" : "d ago");
      }

      function render() {
        let items;
        try { items = JSON.parse(localStorage.getItem("bitebuddy-feedback") || "[]"); } catch (e) { items = []; }
        listEl.innerHTML = "";

        if (!items.length) {
          const e = document.createElement("p");
          e.className = "hint";
          e.textContent = sv ? "📭 Ingen feedback än." : "📭 No feedback yet.";
          listEl.appendChild(e);
          return;
        }

        // newest first; each entry may be an old plain string or a {text,time} object
        items.slice().reverse().forEach(function (it) {
          const text = (typeof it === "string") ? it : (it.text || "");
          const time = (typeof it === "object") ? it.time : null;
          const card = document.createElement("div");
          card.className = "card-block";
          card.innerHTML = '<p style="font-weight:600;">💬 ' + text.replace(/</g, "&lt;") + "</p>" +
            (time ? '<p class="muted-text" style="font-size:13px;margin-top:8px;">🕘 ' + timeAgo(time) + "</p>" : "");
          listEl.appendChild(card);
        });
      }

      document.getElementById("clear-feedback").addEventListener("click", function () {
        if (confirm(sv ? "Rensa ALL feedback? Det går inte att ångra." : "Clear ALL feedback? This can't be undone.")) {
          localStorage.removeItem("bitebuddy-feedback");
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
